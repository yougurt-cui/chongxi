.claim{display:flex;align-items:center;gap:20px;padding:20px;border-radius:16px;background:var(--cream);color:var(--ink);width:100%}.qr{width:128px;height:128px;flex:none;border-radius:12px;object-fit:contain;user-select:auto;-webkit-touch-callout:default}.claim-copy{display:flex;flex-direction:column;gap:8px;min-width:0}.claim-title{font-size:18px;font-weight:700}.claim-detail{font-size:14px;color:#77667e}.mobile-label{display:none}.actions{display:flex;flex-direction:column;align-items:flex-start;gap:18px;width:100%}.action{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:240px;max-width:100%;padding:12px 16px;border:0;border-radius:12px;background:var(--orange);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}.action:hover{background:#ffac55}.action:active{transform:translateY(1px)}.mini-entry[hidden]{display:none!important}.mini-entry{position:relative;width:240px;max-width:100%;min-height:52px}.mini-entry .action{width:100%}.mini-launch{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0;pointer-events:none}.mini-entry[data-state="ready"] .mini-launch{opacity:1;pointer-events:auto}.mini-entry[data-state="ready"] .mini-fallback{visibility:hidden}

@media (max-width:819px){:root{--gutter:20px;--art:60px}.brandbar{padding:18px 0}.brand{font-size:18px}.hero{flex-direction:column;gap:18px;padding:4px 0 calc(28px + env(safe-area-inset-bottom))}.info{display:contents}.intro{order:0;align-items:flex-end;gap:12px}.tagline{text-align:right;font-size:12px}.gallery{order:1;width:100%;flex:auto;gap:8px}.looks{gap:8px}.look{flex-basis:calc((100% - 16px)/3);gap:5px}figcaption,.disclaimer{font-size:10px}.claim{order:2;padding:14px;gap:16px}.qr{width:100px;height:100px}.claim-title{font-size:14px}.claim-detail{font-size:12px}.desktop-label{display:none}.mobile-label{display:inline}.actions{order:3}.action{width:100%;min-height:48px}.mini-entry{width:100%;min-height:52px}}
@media (max-width:359px){:root{--gutter:16px;--art:54px}.claim{gap:12px;padding:12px}.qr{width:88px;height:88px}.edition{font-size:11px}.tagline{font-size:11px}}
@media (prefers-reduced-motion:reduce){.action{transition:none}}

<body>

<script>
/* 微信云开发静态网站免鉴权方案：
   https://developers.weixin.qq.com/minigame/dev/wxcloud/guide/staticstorage/jump-miniprogram.html
   前提：非个人主体且已认证的小程序；从「微信开发者工具 → 云开发 → 更多 → 静态网站」
   开通托管并绑定自定义域名。任意普通托管域名或 file:// 不具备免鉴权能力。
   wx.config 的任意签名值仅适用于上述托管环境；普通域名需另行接入真实 JSSDK 签名。
   仅微信内显示开放标签，因此不需要文档中的外部浏览器 URL Scheme 云函数和 Cloud SDK。
   miniProgramPath 留空打开首页；需要指定活动页时填写已发布的小程序页面路径。
   generateUrl 为生图平台 HTTPS 地址；qrImageUrl 可替换正式小程序码图片。 */
const CONFIG = {
  miniProgramAppId: 'wxec9a56b911900aa0',
  miniProgramOriginalId: 'gh_425032a71c56',
  miniProgramPath: 'pages/halloween/index.html',
  miniProgramUrlLink: '',
  generateUrl: '',
  qrImageUrl: ''
};
(() => {
  const notice = document.getElementById('notice');
  let timer;
  function tell(message) {
    clearTimeout(timer);
    notice.textContent = message;
    timer = setTimeout(() => { notice.textContent = ''; }, 4500);
  }
  function isHttps(value) {
    try { return new URL(value).protocol === 'https:'; } catch { return false; }
  }
  function connect(id, url, message) {
    const link = document.getElementById(id);
    if (isHttps(url)) {
      link.href = url;
      link.removeAttribute('role');
      link.removeAttribute('tabindex');
    } else {
      link.addEventListener('click', () => tell(message));
      link.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          link.click();
        }
      });
    }
  }
  const miniEntry = document.getElementById('mini-entry');
  const miniLink = document.getElementById('mini-link');
  const launch = document.getElementById('mini-launch');
  const isWeChat = /MicroMessenger/i.test(navigator.userAgent) && !/wxwork/i.test(navigator.userAgent);
  launch.setAttribute('username', CONFIG.miniProgramOriginalId);
  if (CONFIG.miniProgramPath) launch.setAttribute('path', CONFIG.miniProgramPath);
  connect('mini-link', CONFIG.miniProgramUrlLink, '小程序入口暂不可用，请稍后再试。');
  miniEntry.hidden = false;
  if (isWeChat) {
    let readyTimer;
    let fallbackMessage = '小程序入口正在加载，请稍后再试，或长按识别上方小程序码。';
    function failLaunch(message) {
      clearTimeout(readyTimer);
      miniEntry.dataset.state = 'error';
      fallbackMessage = message;
    }
    miniLink.addEventListener('click', () => tell(fallbackMessage));
    launch.addEventListener('ready', () => {
      clearTimeout(readyTimer);
      miniEntry.dataset.state = 'ready';
    });
    launch.addEventListener('launch', () => { notice.textContent = ''; });
    launch.addEventListener('error', () => {
      // A launch failure need not disable the valid tag: allow another user tap.
      tell('暂时无法打开小程序，请重试或长按识别上方小程序码。');
    });
    if (location.protocol !== 'https:') {
      failLaunch('请在正式活动链接中打开，或长按识别上方小程序码。');
    } else {
      readyTimer = setTimeout(() => failLaunch('小程序入口暂不可用，请长按识别上方小程序码。'), 12000);
      const sdk = document.createElement('script');
      sdk.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
      sdk.async = true;
      sdk.onerror = () => failLaunch('小程序入口加载失败，请长按识别上方小程序码。');
      sdk.onload = () => {
        try {
          if (!window.wx || typeof window.wx.config !== 'function') throw new Error('WeChat SDK unavailable');
          window.wx.error(() => failLaunch('小程序入口暂不可用，请长按识别上方小程序码。'));
          // Official static-hosting exemption. No AppSecret belongs in this page.
          window.wx.config({
            appId: CONFIG.miniProgramAppId,
            timestamp: 0,
            nonceStr: 'nonceStr',
            signature: 'signature',
            jsApiList: ['chooseImage'],
            openTagList: ['wx-open-launch-weapp']
          });
        } catch (_) {
          failLaunch('小程序入口暂不可用，请长按识别上方小程序码。');
        }
      };
      document.head.appendChild(sdk);
    }
  }
  connect('generate-link', CONFIG.generateUrl, '生图入口暂未开放，请稍后再试。');
  if (CONFIG.qrImageUrl) document.getElementById('mini-qr').src = CONFIG.qrImageUrl;
})();
</script>
