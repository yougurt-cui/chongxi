<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宠析｜B端接单工作台</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2454a6;
      --accent: #29a37a;
      --danger: #dc2626;
      --shadow: 0 14px 32px rgba(24, 39, 75, 0.07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 22px;
    }

    .crumb {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      max-width: 760px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 18px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      line-height: 1;
    }

    .panel {
      padding: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 150px 150px 150px auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .control {
      min-height: 40px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      color: var(--ink);
      outline: none;
    }

    .control:focus {
      border-color: rgba(36, 84, 166, 0.55);
      box-shadow: 0 0 0 3px rgba(36, 84, 166, 0.1);
    }

    .primary {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      padding: 0 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: #fff;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 900;
      padding: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 8px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .detail-block {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.7;
    }

    .empty, .error {
      padding: 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty {
      background: #f8fafc;
      color: var(--muted);
    }

    .error {
      display: none;
      margin-bottom: 14px;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    @media (max-width: 980px) {
      .metrics, .layout, .toolbar {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
      }

      .status {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <a class="crumb" href="/workbench.html">← 返回宠析工作台</a>
        <h1>宠析 B 端接单工作台</h1>
        <p class="lead">正在进入旧版 B2B 接单分析工作台，支持配方画像、目标 SKU 相似度分析和条件检索。</p>
      </div>
      <div class="status"><span class="status-dot"></span>已接入 Flask 主服务</div>
    </header>

    <section class="metrics" aria-label="B端数据概览">
      <div class="metric"><span>可分析产品</span><strong id="productCount">-</strong></div>
      <div class="metric"><span>覆盖品牌</span><strong id="brandCount">-</strong></div>
      <div class="metric"><span>产地类型</span><strong id="originCount">-</strong></div>
      <div class="metric"><span>含价格产品</span><strong id="pricedCount">-</strong></div>
    </section>

    <div id="errorBox" class="error"></div>

    <section class="panel">
      <p class="lead">如果没有自动跳转，请点击下面的按钮进入接单工作台。</p>
      <p><a id="streamlitLink" class="primary" style="display:inline-flex;align-items:center;text-decoration:none;" href="#">进入接单工作台</a></p>
      <div class="toolbar">
        <input id="query" class="control" placeholder="搜索品牌或产品" />
        <select id="origin" class="control">
          <option value="">全部产地</option>
          <option value="国产">国产</option>
          <option value="进口">进口</option>
        </select>
        <select id="price" class="control">
          <option value="">全部价格</option>
          <option value="60元/斤内">60元/斤内</option>
          <option value="60-80元/斤">60-80元/斤</option>
          <option value="80元+/斤">80元+/斤</option>
        </select>
        <select id="availability" class="control">
          <option value="true">仅可对比</option>
          <option value="">全部产品</option>
          <option value="false">缺少评分</option>
        </select>
        <button id="searchBtn" class="primary" type="button">查询</button>
      </div>

      <div class="layout">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>品牌</th>
                <th>产品</th>
                <th>产地</th>
                <th>价格带</th>
                <th>分析状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="productRows">
              <tr><td colspan="6" class="muted">正在加载...</td></tr>
            </tbody>
          </table>
        </div>

        <aside class="panel detail">
          <h2>产品功能定位</h2>
          <div id="detailBox" class="empty">选择一款产品查看 B 端定位信息。</div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const state = { items: [] };
    const nodes = {
      productCount: document.getElementById("productCount"),
      brandCount: document.getElementById("brandCount"),
      originCount: document.getElementById("originCount"),
      pricedCount: document.getElementById("pricedCount"),
      errorBox: document.getElementById("errorBox"),
      query: document.getElementById("query"),
      origin: document.getElementById("origin"),
      price: document.getElementById("price"),
      availability: document.getElementById("availability"),
      searchBtn: document.getElementById("searchBtn"),
      productRows: document.getElementById("productRows"),
      detailBox: document.getElementById("detailBox"),
    };

    function text(value, fallback = "-") {
      const normalized = String(value ?? "").trim();
      return normalized || fallback;
    }

    function showError(message) {
      nodes.errorBox.textContent = message;
      nodes.errorBox.style.display = message ? "block" : "none";
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || "请求失败");
      }
      return data;
    }

    async function loadSummary() {
      const summary = await fetchJson("/api/business/summary");
      nodes.productCount.textContent = summary.product_count ?? "-";
      nodes.brandCount.textContent = summary.brand_count ?? "-";
      nodes.originCount.textContent = summary.origin_count ?? "-";
      nodes.pricedCount.textContent = summary.priced_product_count ?? "-";
    }

    function renderRows(items) {
      if (!items.length) {
        nodes.productRows.innerHTML = '<tr><td colspan="6" class="muted">没有匹配产品。</td></tr>';
        return;
      }
      nodes.productRows.innerHTML = items.map((item, index) => `
        <tr>
          <td>${text(item.brand)}</td>
          <td>
            <strong>${text(item.product_name || item.label)}</strong>
            <div class="muted">${text(item.display_subtitle || item.display_text, "")}</div>
          </td>
          <td>${text(item.origin_type)}</td>
          <td>${text(item.price_band || item.price_bucket || item.price)}</td>
          <td><span class="tag">${item.compare_available ? "可分析" : "缺少评分"}</span></td>
          <td><button class="link-button" type="button" data-index="${index}">查看定位</button></td>
        </tr>
      `).join("");
      nodes.productRows.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => loadPositioning(items[Number(button.dataset.index)]));
      });
    }

    async function loadProducts() {
      showError("");
      nodes.productRows.innerHTML = '<tr><td colspan="6" class="muted">正在加载...</td></tr>';
      const params = new URLSearchParams({
        q: nodes.query.value.trim(),
        origin: nodes.origin.value,
        price_bucket: nodes.price.value,
        compare_available: nodes.availability.value,
        limit: "120",
      });
      const data = await fetchJson(`/api/business/product-options?${params.toString()}`);
      state.items = data.items || [];
      renderRows(state.items);
    }

    function renderPositioning(product, data) {
      const positioning = data.positioning || {};
      const inputScores = data.input_scores || {};
      const functionTags = positioning.function_tags || [];
      const warningTags = positioning.warning_tags || [];
      const tags = [
        ...functionTags.map((item) => item.display_tag || item.tag),
        ...warningTags.map((item) => item.tag),
      ].filter(Boolean);
      nodes.detailBox.className = "";
      nodes.detailBox.innerHTML = `
        <strong>${text(product.brand)} ${text(product.product_name || product.label, "")}</strong>
        <div class="detail-block">
          <div>功能定位：${text(positioning.display_text || positioning.base_positioning)}</div>
          <div>黑下巴风险：${text(inputScores.black_chin_risk_level)}</div>
          <div>软便风险：${text(inputScores.soft_stool_risk_level)}</div>
          <div>蛋白质量：${text(inputScores.protein_quality_score)}</div>
        </div>
        <div class="detail-block">${tags.map((tag) => `<span class="tag">${tag}</span>`).join(" ") || "暂无标签"}</div>
      `;
    }

    async function loadPositioning(product) {
      showError("");
      nodes.detailBox.className = "empty";
      nodes.detailBox.textContent = "正在加载定位信息...";
      try {
        const data = await fetchJson("/api/business/product-positioning", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(product),
        });
        renderPositioning(product, data);
      } catch (error) {
        nodes.detailBox.className = "empty";
        nodes.detailBox.textContent = error.message;
      }
    }

    nodes.searchBtn.addEventListener("click", () => loadProducts().catch((error) => showError(error.message)));
    nodes.query.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        loadProducts().catch((error) => showError(error.message));
      }
    });

    Promise.all([loadSummary(), loadProducts()]).catch((error) => showError(error.message));
    const localHostnames = new Set(["127.0.0.1", "localhost", "0.0.0.0"]);
    const streamlitUrl = localHostnames.has(window.location.hostname)
      ? `${window.location.protocol}//${window.location.hostname}:8503/business/order-analysis/`
      : `${window.location.protocol}//${window.location.hostname}/business/order-analysis/`;
    nodes.streamlitLink = document.getElementById("streamlitLink");
    nodes.streamlitLink.href = streamlitUrl;
    window.setTimeout(() => {
      window.location.href = streamlitUrl;
    }, 800);
  </script>
</body>
</html>
