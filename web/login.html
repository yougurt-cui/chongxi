<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录宠析</title>
  <style>
    :root { --blue:#2454a6; --green:#29a37a; --ink:#102236; --muted:#667085; --line:#e4e7ec; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#eef4ff,#f4fbf8); }
    .panel { width:min(100%,480px); padding:38px; border:1px solid rgba(255,255,255,.8); border-radius:18px; background:rgba(255,255,255,.92); box-shadow:0 22px 60px rgba(29,58,103,.13); }
    .brand { display:flex; align-items:center; gap:11px; margin-bottom:30px; font-weight:800; } .logo { width:39px; height:39px; display:grid; place-items:center; border-radius:10px; color:#fff; background:linear-gradient(135deg,#4e7ff1,#2bbf95); }
    h1 { margin:0; font-size:28px; } .intro { margin:12px 0 27px; color:var(--muted); line-height:1.65; }
    label { display:block; margin:18px 0 8px; font-size:14px; font-weight:700; } input, select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:9px; font:inherit; outline:none; background:#fff; } input:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #e7eefc; }
    button { width:100%; margin-top:25px; min-height:46px; border:0; border-radius:9px; color:#fff; cursor:pointer; font:700 15px inherit; background:linear-gradient(135deg,var(--blue),#3975d6); } button:disabled { opacity:.65; cursor:wait; }
    .hint { margin:17px 0 0; padding:12px; border-radius:9px; background:#f7faff; color:var(--muted); font-size:12px; line-height:1.55; } .error { min-height:20px; margin-top:12px; color:#b42318; font-size:13px; } .back { display:inline-block; margin-top:22px; color:var(--blue); font-size:14px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="logo">宠</span><span>宠析工作台</span></div>
    <h1>登录宠析</h1>
    <p class="intro">请输入宠析工作台账号或宠物食品增长引擎账号。登录后仅显示该账号有权访问的模块。</p>
    <form id="login-form">
      <label for="username">账号 / 手机号</label>
      <input id="username" type="text" autocomplete="username" placeholder="请输入工作台账号或增长引擎手机号" required />
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
      <button id="submit" type="submit">登录并继续</button>
      <div id="error" class="error" aria-live="polite"></div>
    </form>
    <p class="hint">账号与密码仅在服务端的本地环境配置中校验；浏览器不会保存密码或角色信息。</p>
    <a class="back" href="/workbench.html">← 返回工作台</a>
  </main>
  <script>
    const returnTo = new URLSearchParams(location.search).get('return_to') || '/workbench.html';
    const form = document.querySelector('#login-form'), error = document.querySelector('#error'), submit = document.querySelector('#submit');
    form.addEventListener('submit', async (event) => { event.preventDefault(); error.textContent = ''; submit.disabled = true; submit.textContent = '正在登录…';
      try { const response = await fetch('/api/workbench-auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username:document.querySelector('#username').value, password:document.querySelector('#password').value, return_to:returnTo }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error || '登录失败，请稍后重试。'); location.assign(body.return_to); }
      catch (err) { error.textContent = err.message; submit.disabled = false; submit.textContent = '登录并继续'; }
    });
  </script>
</body>
</html>
