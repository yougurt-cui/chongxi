<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宠析 · 内容运营台</title>
  <style>
    :root{--ink:#24322d;--muted:#718078;--line:#dde6e1;--paper:#f5f7f4;--card:#fff;--green:#376f59;--lime:#ddec9a;--warn:#a15d24;--danger:#a94747}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);font-weight:700}.top h1{margin:7px 0 4px;font-size:34px}.top p{margin:0;color:var(--muted)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.primary{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px}.secondary{background:#e8eeea;color:var(--ink);padding:9px 13px;border-radius:10px}.danger{color:var(--danger)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{padding:10px 17px;border-radius:999px;background:#e8eeea;color:var(--muted)}.tab.active{background:var(--lime);color:var(--ink);font-weight:700}.panel{display:none}.panel.active{display:block}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;background:var(--card);padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:16px}.filters input,.filters select,.editor input,.editor textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.summary{font-size:13px;color:var(--muted);margin:9px 2px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.thumb{width:100%;height:210px;object-fit:cover;background:#e8ece9}.body{padding:14px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.pill{font-size:12px;padding:4px 8px;background:#edf2ef;border-radius:999px}.pill.approved,.pill.published{background:#dcedd9;color:#30623c}.pill.failed,.pill.rejected{background:#f6dede;color:#8d3d3d}.title{font-weight:700;line-height:1.45;margin:6px 0}.copy{font-size:13px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{padding:8px 10px;border-radius:9px;background:#edf2ef}.actions button.main{background:var(--ink);color:#fff}.empty{padding:60px;text-align:center;color:var(--muted);background:#fff;border-radius:18px;border:1px dashed var(--line)}dialog{border:0;border-radius:20px;padding:0;width:min(720px,calc(100vw - 32px));box-shadow:0 22px 70px #18251e44}.editor{padding:22px}.editor h2{margin:0 0 16px}.field{display:block;margin:12px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.editor textarea{min-height:110px;resize:vertical}.preview{width:100%;max-height:320px;object-fit:contain;background:#eef1ef;border-radius:14px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:white;padding:12px 17px;border-radius:12px;display:none;z-index:9}.toast.show{display:block}.busy{opacity:.55;pointer-events:none}@media(max-width:760px){.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.top h1{font-size:28px}}
    body.embedded .shell{padding:18px}
    body.embedded .top{display:none}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><div class="eyebrow">PET CONTENT OPERATIONS</div><h1>内容运营台</h1><p>从灵感素材到审核发布，每一步都由运营确认。</p></div><a href="/pipeline-review.html"><button class="secondary">返回管理平台</button></a></header>
    <nav class="tabs"><button class="tab active" data-tab="materials">素材库</button><button class="tab" data-tab="tasks">内容草稿</button></nav>
    <section id="materials" class="panel active">
      <div class="filters"><input id="materialQuery" placeholder="搜索标题、关键词、产品类型"/><select id="category"><option value="">全部类目</option></select><select id="subCategory"><option value="">全部子类</option></select><select id="reviewStatus"><option value="">全部审核状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select><button id="searchMaterials" class="primary">筛选</button></div>
      <div id="materialSummary" class="summary"></div><div id="materialGrid" class="grid"></div>
    </section>
    <section id="tasks" class="panel">
      <div class="filters" style="grid-template-columns:1fr auto"><select id="taskStatus"><option value="">全部任务状态</option><option value="draft">草稿</option><option value="approved">已审核</option><option value="published">已发布</option><option value="failed">失败</option></select><button id="refreshTasks" class="primary">刷新</button></div>
      <div id="taskSummary" class="summary"></div><div id="taskGrid" class="grid"></div>
    </section>
  </main>

  <dialog id="materialDialog"><form class="editor" method="dialog"><h2>编辑素材</h2><img id="materialPreview" class="preview"/><input id="materialId" type="hidden"/><label class="field"><span>类目</span><input id="editCategory"/></label><label class="field"><span>子类目</span><input id="editSubCategory"/></label><label class="field"><span>产品类型</span><input id="editProductType"/></label><label class="field"><span>主体</span><textarea id="editSubject"></textarea></label><label class="field"><span>宠物动作</span><textarea id="editAction"></textarea></label><label class="field"><span>场景</span><textarea id="editScene"></textarea></label><label class="field"><span>运营备注</span><textarea id="editNote"></textarea></label><label class="field"><span>审核状态</span><select id="editReview"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select></label><div class="modal-actions"><button value="cancel" class="secondary">取消</button><button id="saveMaterial" value="none" class="primary">保存</button></div></form></dialog>

  <dialog id="taskDialog"><form class="editor" method="dialog"><h2>编辑内容草稿</h2><img id="taskPreview" class="preview"/><input id="taskId" type="hidden"/><label class="field"><span>生图 Prompt</span><textarea id="editPrompt"></textarea></label><label class="field"><span>标题</span><input id="editTitle" maxlength="80"/></label><label class="field"><span>正文</span><textarea id="editContent" maxlength="2000"></textarea></label><label class="field"><span>标签（逗号分隔）</span><input id="editHashtags"/></label><div class="modal-actions"><button value="cancel" class="secondary">取消</button><button id="saveTask" value="none" class="primary">保存草稿</button></div></form></dialog>
  <div id="toast" class="toast"></div>
  <script>
    if(new URLSearchParams(location.search).get("embedded")==="1")document.body.classList.add("embedded");
    const $=id=>document.getElementById(id), esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    const toast=(m)=>{const e=$("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2800)};
    async function api(path,options={},retry=false){const headers=new Headers(options.headers||{});headers.set("Content-Type","application/json");const token=sessionStorage.getItem("chongxi_admin_token")||"";if(token)headers.set("X-Admin-Token",token);const r=await fetch(path,{...options,headers});const d=await r.json();if(r.status===401&&!retry){const t=prompt("请输入管理员令牌：");if(t){sessionStorage.setItem("chongxi_admin_token",t.trim());return api(path,options,true)}}if(!r.ok||d.ok===false)throw new Error(d.error||d.message||"请求失败");return d}
    document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(e=>e.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");if(b.dataset.tab==="tasks")loadTasks()});
    let materials=[];
    async function loadMaterials(){try{const qs=new URLSearchParams({q:$("materialQuery").value,category:$("category").value,sub_category:$("subCategory").value,review_status:$("reviewStatus").value,page_size:"60"});const d=await api(`/api/admin/pet-content/materials?${qs}`);materials=d.items;$("materialSummary").textContent=`共 ${d.total} 条素材`;fillCategories(d.categories);$("materialGrid").innerHTML=d.items.length?d.items.map(materialCard).join(""):'<div class="empty">没有符合条件的素材</div>'}catch(e){toast(e.message)}}
    function fillCategories(rows){if($("category").options.length>1)return;[...new Set(rows.map(x=>x.category))].forEach(x=>$("category").add(new Option(x,x)));rows.forEach(x=>$("subCategory").add(new Option(`${x.category} · ${x.sub_category}`,x.sub_category)))}
    function materialCard(x){return `<article class="card"><img class="thumb" src="${esc(x.image_url)}" loading="lazy" referrerpolicy="no-referrer"/><div class="body"><div class="meta"><span class="pill">${esc(x.category)}</span><span class="pill">${esc(x.sub_category)}</span><span class="pill ${esc(x.review_status)}">${esc(x.review_status)}</span></div><div class="title">${esc(x.title||x.product_type||"未命名素材")}</div><div class="copy">${esc(x.main_subject||x.pet_action||x.search_keyword)}</div><div class="summary">使用 ${x.used_count||0} 次 · ${esc(x.platform)}</div><div class="actions"><button onclick="editMaterial(${x.id})">编辑</button><button class="main" onclick="generateTask(${x.id})">生成内容</button><button class="danger" onclick="deleteMaterial(${x.id})">删除</button></div></div></article>`}
    window.editMaterial=id=>{const x=materials.find(v=>v.id===id);$("materialId").value=id;$("materialPreview").src=x.image_url;$("editCategory").value=x.category||"";$("editSubCategory").value=x.sub_category||"";$("editProductType").value=x.product_type||"";$("editSubject").value=x.main_subject||"";$("editAction").value=x.pet_action||"";$("editScene").value=x.usage_scene||"";$("editNote").value=x.operator_note||"";$("editReview").value=x.review_status||"pending";$("materialDialog").showModal()};
    $("saveMaterial").onclick=async e=>{e.preventDefault();try{await api(`/api/admin/pet-content/materials/${$("materialId").value}`,{method:"PATCH",body:JSON.stringify({category:$("editCategory").value,sub_category:$("editSubCategory").value,product_type:$("editProductType").value,main_subject:$("editSubject").value,pet_action:$("editAction").value,usage_scene:$("editScene").value,operator_note:$("editNote").value,review_status:$("editReview").value})});$("materialDialog").close();toast("素材已保存");loadMaterials()}catch(e){toast(e.message)}};
    window.deleteMaterial=async id=>{if(!confirm("确认逻辑删除这条素材？"))return;try{await api(`/api/admin/pet-content/materials/${id}`,{method:"DELETE"});toast("素材已删除");loadMaterials()}catch(e){toast(e.message)}};
    window.generateTask=async id=>{if(!confirm("将创建后台生成任务，完成后进入草稿，继续吗？"))return;toast("正在创建任务…");try{const d=await api("/api/admin/pet-content/tasks",{method:"POST",body:JSON.stringify({material_id:id})});toast(`任务已创建：${d.item.status}`);document.querySelector('[data-tab="tasks"]').click()}catch(e){toast(e.message)}};
    let tasks=[];
    async function loadTasks(){try{const qs=new URLSearchParams({status:$("taskStatus").value,limit:"100"});const d=await api(`/api/admin/pet-content/tasks?${qs}`);tasks=d.items;const running=d.items.filter(x=>['pending','generating_image','generating_copy'].includes(x.status)).length;$("taskSummary").textContent=`共 ${d.count} 个内容任务${running?` · ${running} 个生成中`:''}`;$("taskGrid").innerHTML=d.items.length?d.items.map(taskCard).join(""):'<div class="empty">还没有内容任务</div>';scheduleTaskRefresh(running>0)}catch(e){toast(e.message)}}
    let taskRefreshTimer=null;function scheduleTaskRefresh(active){clearTimeout(taskRefreshTimer);if(active&&$("tasks").classList.contains("active"))taskRefreshTimer=setTimeout(loadTasks,3000)}
    function taskCard(x){return `<article class="card"><img class="thumb" src="${esc(x.generated_image_url||x.material_image_url)}" loading="lazy"/><div class="body"><div class="meta"><span class="pill ${esc(x.status)}">${esc(x.status)}</span><span class="pill ${esc(x.publish_status)}">${esc(x.publish_status)}</span></div><div class="title">${esc(x.title||"生成任务")}</div><div class="copy">${esc(x.content||x.error_message||"处理中")}</div><div class="actions"><button onclick="editTask('${x.id}')">编辑</button>${x.publish_status!=='published'?`<button onclick="regenerateImage('${x.id}')">重生图片</button>`:""}${x.status==='draft'?`<button onclick="approveTask('${x.id}')">审核通过</button>`:""}${x.status==='approved'?`<button class="main" onclick="publishTask('${x.id}')">发布</button>`:""}</div></div></article>`}
    window.editTask=id=>{const x=tasks.find(v=>v.id===id);$("taskId").value=id;$("taskPreview").src=x.generated_image_url||x.material_image_url;$("editPrompt").value=x.image_prompt||"";$("editTitle").value=x.title||"";$("editContent").value=x.content||"";$("editHashtags").value=(x.hashtags||[]).join(", ");$("taskDialog").showModal()};
    $("saveTask").onclick=async e=>{e.preventDefault();try{await api(`/api/admin/pet-content/tasks/${$("taskId").value}`,{method:"PATCH",body:JSON.stringify({image_prompt:$("editPrompt").value,title:$("editTitle").value,content:$("editContent").value,hashtags:$("editHashtags").value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)})});$("taskDialog").close();toast("草稿已保存");loadTasks()}catch(e){toast(e.message)}};
    window.approveTask=async id=>{if(!confirm("确认图片和文案已经审核？"))return;try{await api(`/api/admin/pet-content/tasks/${id}/approve`,{method:"POST",body:"{}"});toast("已审核通过");loadTasks()}catch(e){toast(e.message)}};
    window.regenerateImage=async id=>{if(!confirm("将根据当前 Prompt 创建后台重生任务，继续吗？"))return;toast("正在创建重生任务…");try{const d=await api(`/api/admin/pet-content/tasks/${id}/regenerate-image`,{method:"POST",body:"{}"});toast(`任务已创建：${d.item.status}`);loadTasks()}catch(e){toast(e.message)}};
    window.publishTask=async id=>{if(!confirm("确认发布到小程序社区？发布后不可在此修改。"))return;try{await api(`/api/admin/pet-content/tasks/${id}/publish`,{method:"POST",body:"{}"});toast("发布成功");loadTasks()}catch(e){toast(e.message)}};
    $("searchMaterials").onclick=loadMaterials;$("refreshTasks").onclick=loadTasks;$("taskStatus").onchange=loadTasks;loadMaterials();
  </script>
</body>
</html>
