<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宠析｜数据生产线人工确认</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --primary: #2454a6;
      --accent: #29a37a;
      --danger: #c2410c;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 14px 32px rgba(24, 39, 75, 0.07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    a { color: inherit; text-decoration: none; }
    button, textarea, input { font: inherit; }
    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4e7ff1, #2bbf95);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }
    h1, h2, h3, p { margin: 0; }
    .brand h1 { font-size: 20px; color: #102236; }
    .brand p { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .back {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 18px;
    }
    .eyebrow {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 8px;
      background: #e7eefc;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .hero h2 { font-size: clamp(28px, 4vw, 42px); line-height: 1.12; color: #102236; }
    .hero p { margin-top: 12px; color: var(--muted); line-height: 1.7; max-width: 820px; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-bottom: 18px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 8px;
    }
    .tab {
      border: 0;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 14px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .tab.active {
      background: var(--primary);
      color: #fff;
    }
    .button {
      border: 0;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 14px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .button.secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--line);
    }
    .button.danger { background: var(--danger); }
    .button:disabled { opacity: 0.55; cursor: not-allowed; }
    .muted { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .title { font-size: 17px; font-weight: 800; color: #102236; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      min-width: 1080px;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      background: var(--panel-soft);
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    .task-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #374151;
    }
    .reason-cell {
      max-width: 260px;
      color: #9a3412;
      line-height: 1.55;
    }
    .payload-cell {
      max-width: 220px;
      color: var(--muted);
      line-height: 1.55;
    }
    .row-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 260px;
    }
    .small-button {
      border: 0;
      border-radius: 8px;
      min-height: 32px;
      padding: 0 10px;
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .small-button.secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--line);
    }
    .small-button.danger { background: var(--danger); }
    .status-badge {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      padding: 0 8px;
      border-radius: 8px;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      font-size: 12px;
      font-weight: 800;
    }
    pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      border-radius: 8px;
      background: #111827;
      color: #d1d5db;
      padding: 12px;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    dialog {
      width: min(760px, calc(100% - 32px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.28);
    }
    dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
    .modal {
      background: #fff;
      padding: 18px;
    }
    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }
    .cell-input {
      min-width: 160px;
      min-height: 34px;
      padding: 7px 9px;
      font-size: 13px;
    }
    .section[hidden] { display: none; }
    textarea { min-height: 172px; resize: vertical; line-height: 1.55; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 12px;
    }
    .empty {
      text-align: center;
      padding: 44px 18px;
      color: var(--muted);
    }
    .toast {
      margin-bottom: 14px;
      display: none;
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.6;
    }
    .toast.show { display: block; }
    .toast.ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .toast.error { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    @media (max-width: 820px) {
      .topbar, .toolbar, .tabs { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">数</div>
        <div>
          <h1>宠析数据生产线</h1>
          <p>Pipeline review console</p>
        </div>
      </div>
      <a class="back" href="/">返回工作台</a>
    </header>

    <section class="hero">
      <div class="eyebrow">人工确认</div>
      <h2>数据生产线人工确认</h2>
      <p>集中处理编排服务中需要人工确认或执行失败的节点，并修正 OCR 派生出的品牌和产品身份，确保后续特征、画像和风险结果使用一致的 product_key。</p>
    </section>

    <section class="tabs" aria-label="人工确认菜单">
      <button id="nodeTab" class="tab active" type="button" data-tab="node">node节点调度</button>
      <button id="identityTab" class="tab" type="button" data-tab="identity">brand身份认证</button>
    </section>

    <div id="toast" class="toast"></div>

    <section id="nodeSection" class="section">
      <section class="toolbar">
        <div>
          <div class="title">待处理节点列表</div>
          <div id="summary" class="muted">正在加载...</div>
        </div>
        <button id="refresh" class="button secondary" type="button">刷新</button>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>任务</th>
                <th>任务类型</th>
                <th>节点</th>
                <th>状态</th>
                <th>失败原因</th>
                <th>输入摘要</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reviewRows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" style="display:none;">暂无需要处理的节点。</div>
      </section>
    </section>

    <section id="identitySection" class="section" hidden>
      <section class="toolbar">
        <div>
          <div class="title">待确认品牌身份</div>
          <div id="identitySummary" class="muted">等待扫描...</div>
        </div>
        <button id="identityRefresh" class="button secondary" type="button">扫描身份</button>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>来源</th>
                <th>图片</th>
                <th>当前身份</th>
                <th>修正品牌</th>
                <th>修正产品名</th>
                <th>原料摘要</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="identityRows"></tbody>
          </table>
        </div>
        <div id="identityEmpty" class="empty" style="display:none;">暂无需要确认身份的数据。</div>
      </section>
    </section>

    <dialog id="ocrDialog">
      <form method="dialog" class="modal">
        <div class="modal-head">
          <div>
            <div class="title">OCR 文本修改</div>
            <div id="ocrDialogMeta" class="muted" style="margin-top:6px;"></div>
          </div>
          <button class="small-button secondary" value="cancel" type="submit">关闭</button>
        </div>
        <textarea id="ocrText" placeholder="粘贴或修改 OCR 文本"></textarea>
        <div class="modal-actions">
          <button class="button secondary" value="cancel" type="submit">取消</button>
          <button id="submitOcr" class="button" value="default" type="button">提交修改</button>
        </div>
      </form>
    </dialog>

    <dialog id="outputDialog">
      <form method="dialog" class="modal">
        <div class="modal-head">
          <div>
            <div class="title">节点输出</div>
            <div id="outputDialogMeta" class="muted" style="margin-top:6px;"></div>
          </div>
          <button class="small-button secondary" value="cancel" type="submit">关闭</button>
        </div>
        <pre id="outputJson"></pre>
      </form>
    </dialog>
  </main>

  <script>
    const rowsEl = document.getElementById("reviewRows");
    const emptyEl = document.getElementById("empty");
    const summaryEl = document.getElementById("summary");
    const toastEl = document.getElementById("toast");
    const refreshBtn = document.getElementById("refresh");
    const ocrDialog = document.getElementById("ocrDialog");
    const ocrDialogMeta = document.getElementById("ocrDialogMeta");
    const ocrTextEl = document.getElementById("ocrText");
    const submitOcrBtn = document.getElementById("submitOcr");
    const outputDialog = document.getElementById("outputDialog");
    const outputDialogMeta = document.getElementById("outputDialogMeta");
    const outputJsonEl = document.getElementById("outputJson");
    const nodeTab = document.getElementById("nodeTab");
    const identityTab = document.getElementById("identityTab");
    const nodeSection = document.getElementById("nodeSection");
    const identitySection = document.getElementById("identitySection");
    const identityRowsEl = document.getElementById("identityRows");
    const identityEmptyEl = document.getElementById("identityEmpty");
    const identitySummaryEl = document.getElementById("identitySummary");
    const identityRefreshBtn = document.getElementById("identityRefresh");
    let activeOcrItem = null;
    let activeTab = "node";

    function showToast(message, type = "ok") {
      toastEl.textContent = message;
      toastEl.className = `toast show ${type}`;
      window.setTimeout(() => {
        toastEl.className = "toast";
      }, 2600);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok || data.ok === false) {
        throw new Error(data.error || "请求失败");
      }
      return data;
    }

    function safeJson(value) {
      return JSON.stringify(value || {}, null, 2);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function compactText(value, maxLength = 90) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (!text) return "-";
      return text.length > maxLength ? `${text.slice(0, maxLength)}...` : text;
    }

    function textFromOutput(output) {
      return (output && (output.ocr_text || output.text)) || "";
    }

    function payloadSummary(payload) {
      const parts = [];
      if (payload.product_name) parts.push(`产品：${payload.product_name}`);
      if (payload.original_filename) parts.push(`图片：${payload.original_filename}`);
      if (payload.image_id) parts.push(`图片ID：${String(payload.image_id).slice(0, 8)}`);
      if (payload.cat_food_task_id) parts.push(`来源任务：${String(payload.cat_food_task_id).slice(0, 8)}`);
      return parts.length ? parts.join("｜") : "-";
    }

    function renderItems(items) {
      summaryEl.textContent = `${items.length} 个待处理节点`;
      rowsEl.innerHTML = "";
      emptyEl.style.display = items.length ? "none" : "block";
      if (!items.length) {
        return;
      }
      items.forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>
            <div class="task-id">${item.task_id}</div>
            <div class="muted" style="margin-top:4px;">${item.task_id.slice(0, 8)}</div>
          </td>
          <td><span class="chip">${item.task_type}</span></td>
          <td>
            <div style="font-weight:800;color:#102236;">${item.node_name}</div>
            <div class="muted" style="margin-top:4px;">${item.node_code}</div>
          </td>
          <td><span class="status-badge">${item.node_status === "failed" ? "执行失败" : item.node_status}</span></td>
          <td class="reason-cell">${item.node_error_message || "需要人工确认"}</td>
          <td class="payload-cell">${payloadSummary(item.task_payload)}</td>
          <td class="muted">${item.node_updated_at}</td>
          <td>
            <div class="row-actions">
              <button class="small-button secondary" data-action="output" type="button">查看输出</button>
              ${item.node_code === "ocr_formula" && item.node_status !== "failed" ? '<button class="small-button" data-action="ocr" type="button">OCR 修改</button>' : ""}
              <button class="small-button secondary" data-action="reextract" type="button">重新抽取</button>
              <button class="small-button danger" data-action="cancel" type="button">作废</button>
            </div>
          </td>
        `;

        row.querySelector('[data-action="output"]').addEventListener("click", () => {
          outputDialogMeta.textContent = `${item.task_id.slice(0, 8)}｜${item.node_code}`;
          outputJsonEl.textContent = safeJson(item.output);
          outputDialog.showModal();
        });

        row.querySelector('[data-action="cancel"]').addEventListener("click", async () => {
          if (!window.confirm("确认作废整个编排任务？")) return;
          await runAction(async () => {
            await api(`/api/orchestrator/tasks/${item.task_id}/cancel`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ reason: "人工确认页面作废" }),
            });
            showToast("任务已作废");
          });
        });

        const ocrButton = row.querySelector('[data-action="ocr"]');
        if (ocrButton) {
          ocrButton.addEventListener("click", () => {
            activeOcrItem = item;
            ocrDialogMeta.textContent = `${item.task_id.slice(0, 8)}｜${item.node_code}`;
            ocrTextEl.value = textFromOutput(item.output);
            ocrDialog.showModal();
          });
        }

        row.querySelector('[data-action="reextract"]').addEventListener("click", async () => {
          await runAction(async () => {
            await api(`/api/orchestrator/tasks/${item.task_id}/nodes/${item.node_code}/reextract`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ reason: "人工确认页面触发重新抽取" }),
            });
            showToast("节点已重置为重新抽取");
          });
        });

        rowsEl.appendChild(row);
      });
    }

    function renderIdentityItems(items) {
      identitySummaryEl.textContent = `${items.length} 条待确认身份数据`;
      identityRowsEl.innerHTML = "";
      identityEmptyEl.style.display = items.length ? "none" : "block";
      if (!items.length) {
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("tr");
        const rowKey = String(item.parsed_row_id || item.source_id);
        row.innerHTML = `
          <td>
            <div class="task-id">source_id: ${escapeHtml(item.source_id || "-")}</div>
            <div class="muted" style="margin-top:4px;">parsed_row_id: ${escapeHtml(item.parsed_row_id || "-")}</div>
          </td>
          <td>
            <div style="font-weight:800;color:#102236;">${escapeHtml(item.image_name || "-")}</div>
            <div class="muted" style="margin-top:4px;">${escapeHtml(item.file_sha256 ? String(item.file_sha256).slice(0, 12) : "-")}</div>
          </td>
          <td>
            <div><span class="chip">${escapeHtml(item.brand || "空")}</span></div>
            <div style="margin-top:8px;"><span class="chip">${escapeHtml(item.product_name || "空")}</span></div>
            <div class="muted" style="margin-top:8px;">${escapeHtml(item.old_product_key || "-")}</div>
          </td>
          <td><input class="cell-input" data-field="brand" data-key="${escapeHtml(rowKey)}" value="${escapeHtml(item.suggested_brand || "")}" placeholder="正确品牌" /></td>
          <td><input class="cell-input" data-field="product_name" data-key="${escapeHtml(rowKey)}" value="${escapeHtml(item.suggested_product_name || "")}" placeholder="正确产品名" /></td>
          <td class="payload-cell">${escapeHtml(compactText(item.ingredient_composition))}</td>
          <td class="muted">${escapeHtml(item.updated_ts || item.created_ts || "-")}</td>
          <td>
            <div class="row-actions">
              <button class="small-button" data-action="confirm-identity" type="button">确认修正</button>
              <button class="small-button secondary" data-action="identity-output" type="button">查看详情</button>
            </div>
          </td>
        `;

        row.querySelector('[data-action="identity-output"]').addEventListener("click", () => {
          outputDialogMeta.textContent = `source_id ${item.source_id || "-"}｜parsed_row_id ${item.parsed_row_id || "-"}`;
          outputJsonEl.textContent = safeJson(item);
          outputDialog.showModal();
        });

        row.querySelector('[data-action="confirm-identity"]').addEventListener("click", async () => {
          const brand = row.querySelector('[data-field="brand"]').value.trim();
          const productName = row.querySelector('[data-field="product_name"]').value.trim();
          if (!brand || !productName) {
            showToast("品牌和产品名都需要填写", "error");
            return;
          }
          if (!window.confirm(`确认把该图身份修正为：${brand}｜${productName}？`)) {
            return;
          }
          await runAction(async () => {
            const result = await api("/api/product-identity/corrections", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source_id: item.source_id,
                parsed_row_id: item.parsed_row_id,
                brand,
                product_name: productName,
                reviewer: "pipeline-review-page",
                reason: "brand身份认证页面确认修正",
              }),
            });
            const csvRows = (result.updates?.csv_labeling || []).reduce((sum, x) => sum + (x.updated_rows || 0), 0);
            const featureRows = (result.updates?.feature || []).reduce((sum, x) => sum + (x.updated_rows || 0), 0);
            showToast(`身份已修正，csv ${csvRows} 行，feature ${featureRows} 行`);
          });
        });

        identityRowsEl.appendChild(row);
      });
    }

    async function runAction(fn) {
      try {
        await fn();
        if (activeTab === "identity") {
          await loadIdentityItems();
        } else {
          await loadItems();
        }
      } catch (error) {
        showToast(error instanceof Error ? error.message : "操作失败", "error");
      }
    }

    async function loadItems() {
      refreshBtn.disabled = true;
      summaryEl.textContent = "正在加载...";
      try {
        const data = await api("/api/orchestrator/reviews?limit=100&statuses=need_review,failed");
        renderItems(data.items || []);
      } catch (error) {
        summaryEl.textContent = "加载失败";
        rowsEl.innerHTML = "";
        emptyEl.style.display = "block";
        emptyEl.textContent = error instanceof Error ? error.message : "加载失败";
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function loadIdentityItems() {
      identityRefreshBtn.disabled = true;
      identitySummaryEl.textContent = "正在扫描...";
      try {
        const data = await api("/api/product-identity/reviews?limit=200");
        renderIdentityItems(data.items || []);
      } catch (error) {
        identitySummaryEl.textContent = "扫描失败";
        identityRowsEl.innerHTML = "";
        identityEmptyEl.style.display = "block";
        identityEmptyEl.textContent = error instanceof Error ? error.message : "扫描失败";
      } finally {
        identityRefreshBtn.disabled = false;
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      nodeTab.classList.toggle("active", tab === "node");
      identityTab.classList.toggle("active", tab === "identity");
      nodeSection.hidden = tab !== "node";
      identitySection.hidden = tab !== "identity";
      if (tab === "identity" && !identityRowsEl.children.length) {
        loadIdentityItems();
      }
      if (tab === "node" && !rowsEl.children.length) {
        loadItems();
      }
    }

    submitOcrBtn.addEventListener("click", async () => {
      if (!activeOcrItem) return;
      const item = activeOcrItem;
      const ocrText = ocrTextEl.value;
      await runAction(async () => {
        await api(`/api/orchestrator/tasks/${item.task_id}/ocr-text`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ocr_text: ocrText, reviewer: "pipeline-review-page" }),
        });
        ocrDialog.close();
        activeOcrItem = null;
        showToast("OCR 文本已提交并重新检查");
      });
    });

    refreshBtn.addEventListener("click", loadItems);
    identityRefreshBtn.addEventListener("click", loadIdentityItems);
    nodeTab.addEventListener("click", () => switchTab("node"));
    identityTab.addEventListener("click", () => switchTab("identity"));
    loadItems();
  </script>
</body>
</html>
